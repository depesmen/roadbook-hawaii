const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
 const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(B.s),iterations:B.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(B.i)},k,u(B.c)));
}
function show(html,code,remember){
 try{sessionStorage.setItem("rb-code",code);if(remember)localStorage.setItem("rb-code",code);}catch(e){}
 document.open();document.write(html);document.close();
}
let saved=null;try{saved=localStorage.getItem("rb-code")||sessionStorage.getItem("rb-code");}catch(e){}
if(saved){try{return show(await open(saved),saved,false);}catch(e){try{localStorage.removeItem("rb-code");sessionStorage.removeItem("rb-code");}catch(_){}}}
const g=document.getElementById("gate");g.hidden=false;
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();
 const c=document.getElementById("c").value.trim(),b=document.getElementById("b"),e=document.getElementById("e");
 b.disabled=true;e.textContent="";
 try{show(await open(c),c,document.getElementById("r").checked);}
 catch(_){e.textContent="Code incorrect.";b.disabled=false;}
});
})();
